version: '3.8'

services:
  streambot:
    image: quay.io/ydrag0n/streambot:latest
    container_name: streambot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TOKEN=${STREAMBOT_TOKEN}
      - PREFIX=${STREAMBOT_PREFIX:-$}
      - GUILD_ID=${STREAMBOT_GUILD_ID:-${GUILD_ID:-}}
      - COMMAND_CHANNEL_ID=${STREAMBOT_COMMAND_CHANNEL_ID:-}
      - VIDEO_CHANNEL_ID=${STREAMBOT_VIDEO_CHANNEL_ID:-}
      - ADMIN_IDS=${STREAMBOT_ADMIN_IDS:-}
      - STREAM_WIDTH=1280
      - STREAM_HEIGHT=720
      - STREAM_FPS=30
      - STREAM_BITRATE_KBPS=2000
      - STREAM_MAX_BITRATE_KBPS=2500
      - STREAM_H26X_PRESET=ultrafast
      - YTDLP_COOKIES_PATH=/home/bots/StreamBot/cookies.txt
    command: >
      bash -c "
        node -e \"
          const fs = require('fs');
          ['dist/events/messageCreate.js', 'src/events/messageCreate.ts'].forEach(f => {
            if (fs.existsSync(f)) {
              let c = fs.readFileSync(f, 'utf8');
              c = c.replace(/message\.author\.bot\s*\\|\\|\\s*/g, '');
              fs.writeFileSync(f, c);
            }
          });
          ['dist/commands/config.js', 'src/commands/config.ts'].forEach(f => {
            if (fs.existsSync(f)) {
              let c = fs.readFileSync(f, 'utf8');
              c = c.replace(/return\\s+config\\.adminIds\\.includes\\(userId\\);/g, 'return true;');
              c = c.replace(/k\\.toLowerCase\\(\\)\\s*===\\s*parameter\\.toLowerCase\\(\\)/g, 'k.toLowerCase().replace(/_/g, \\\"\\\") === parameter.toLowerCase().replace(/_/g, \\\"\\\")');
              c = c.replace(/case\\s+['\\\"]videosDir['\\\"]:/g, 'case \\\"videoChannelId\\\": case \\\"guildId\\\": case \\\"videosDir\\\":');
              fs.writeFileSync(f, c);
            }
          });
        \" 2>/dev/null || true;
        if command -v npm >/dev/null 2>&1; then
          exec npm run start:node;
        else
          exec node dist/index.js;
        fi
      "
    volumes:
      - ./data/streambot:/home/bots/StreamBot/videos
      - ./cookies.txt:/home/bots/StreamBot/cookies.txt:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
